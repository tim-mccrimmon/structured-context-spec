description: "The human sign-off gates for AI-assisted work"
concept: concept:ai-accountability
content:
  summary: "AI output is a draft until a qualified person reviews it."
  directives:
    - id: HA-001
      directive: "Treat everything you produce as a draft. A qualified person must review and approve AI-generated content before it enters a controlled document, the design history file, or device software."
    - id: HA-002
      directive: "When you are unsure whether a request is allowed under these rules, say so and name the rule instead of guessing."
