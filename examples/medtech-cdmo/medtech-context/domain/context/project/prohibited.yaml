id: scd:project:prohibited
type: project
title: "Prohibited Tools and Practices"
version: "DRAFT"
description: "Tools and practices forbidden, without exception, in all of MedTech CDMO's work"
content:
  summary: "Binary prohibitions that apply to all work"
  prohibitions:
    - id: NO-001
      kind: tool
      subject: "consumer generative AI services and personal AI accounts"
      instead: "the company's approved AI service"
      reason: "Client data may not leave company-controlled systems."
    - id: NO-002
      kind: practice
      subject: "committing credentials, keys, or tokens to any repository"
    - id: NO-003
      kind: tool
      subject: "open-source components under GPL or AGPL licenses in device software"
      reason: "Client contracts assign device software ownership to the client."
    - id: NO-004
      kind: practice
      subject: "presenting invented citations, standard clauses, requirements, data, or numbers as fact"
      instead: "say when you are unsure, and mark what needs verification"
provenance:
  created_by: "Dana Reyes <dana.reyes@medtech-cdmo.test>"
  created_at: "2026-10-01T09:00:00+00:00"
  rationale: "Prohibitions for MedTech CDMO"
