# Validates every workspace of this Domain repository on each push and pull request.
# Generated by `scs new domain` (scs-tools 0.7.1).
name: SCS validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Version checks read git tags, so fetch full history and all tags (a shallow clone fails
      # with GIT_HISTORY_INCOMPLETE).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "scs-validator @ https://github.com/tim-mccrimmon/structured-context-spec/releases/download/v0.7.1/scs_validator-0.7.1-py3-none-any.whl"
      - run: scs-validate --strict