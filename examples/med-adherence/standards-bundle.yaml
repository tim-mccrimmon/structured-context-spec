# ================================================================
# SCS Bundle: Standards Bundle - Medication Adherence System
# ================================================================
# Contains compliance and regulatory standards applicable to this project.
# Includes HIPAA-specific SCDs, defined locally.
# A standards bundle contains imports OR scds, not both (XOR constraint) - this one
# defines its SCDs directly rather than importing an external standards bundle. A prior
# version of this file imported a SOC2 bundle that never existed anywhere in this repo
# alongside these SCDs, which is invalid; fixed 2026-09-27 (ISS-022).
# ================================================================

id: bundle:standards
type: standards
version: "0.1.0"
title: "Medication Adherence System - Standards Bundle"
description: >
  Standards and compliance requirements bundle for the Medication Adherence system.
  Includes HIPAA requirements (project-specific interpretations and mappings).

# No external standards bundles imported (see note above) - the schema requires this key
# present even when empty.
imports: []

# HIPAA-specific SCDs (project interpretations and mappings)
scds:
  - scd:standards:hipaa-privacy-rule
  - scd:standards:hipaa-security-rule
  - scd:standards:hipaa-breach-notification

provenance:
  created_by: "compliance-team@medtech.com"
  created_at: "2025-11-01T09:30:00Z"
  updated_by: "compliance-team@medtech.com"
  updated_at: "2025-11-15T16:00:00Z"
  version_approved_by: "compliance-team@medtech.com"
  version_approved_at: "2026-09-21T00:00:00Z"
  rationale: "Standards bundle for healthcare compliance - HIPAA requirements"
