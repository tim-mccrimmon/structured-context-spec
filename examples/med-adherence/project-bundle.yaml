id: bundle:medication-adherence
type: project
version: "0.1.0"
title: "Medication Adherence System"
description: >
  Project governance for the Medication Adherence system, organized by concept.
  This system helps patients track medication schedules, sends reminders,
  and provides adherence insights to healthcare providers. It carries only
  project-specific context; organization-wide rules belong in the
  organization's Domain bundle, which this bundle does not import (SCS 0.6.0).

