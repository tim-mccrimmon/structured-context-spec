# Diagnostic codes for section owners (D-92).
# Merged into ../codes.yaml by tools/scd-validator/scripts/build_codes.py.

codes:
  BUNDLE_OWNER_MISSING:
    severity: warning
    meaning: A concept bundle, or a Project bundle that lists SCDs directly, names no owner role; versioning it is an error (D-92).
  BUNDLE_OWNER_UNMAPPED:
    severity: warning
    meaning: A bundle's owner role is not mapped to a person in the workspace's intake.yaml owners; versioning it is an error (D-92).
  VERSION_OWNER_MISSING:
    severity: error
    meaning: The bundle being versioned needs an owner role and names none; set one with scs bundle set-owner (D-92).
  VERSION_OWNER_UNMAPPED:
    severity: error
    meaning: The bundle being versioned names an owner role that intake.yaml owners does not map to a person; add it with scs intake set owners (D-92).
  OWNER_ROLE_INVALID:
    severity: error
    meaning: An owner role is not lowercase letters, digits, and hyphens; exit code 3.
  OWNER_NOT_APPLICABLE:
    severity: error
    meaning: scs bundle set-owner named a bundle that holds no SCDs of its own (a Domain bundle, or a Project bundle that imports concepts).
