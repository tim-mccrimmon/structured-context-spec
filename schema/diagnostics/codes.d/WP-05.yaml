# Diagnostic codes added by WP-05 (machine mode core: envelope, exit codes, compile, add, scd write).
# Merged into ../codes.yaml by tools/scd-validator/scripts/build_codes.py.

codes:
  USAGE_ERROR:
    severity: error
    meaning: The command line is wrong (unknown option, missing argument, conflicting options); exit code 3.
  NO_INPUT:
    severity: error
    meaning: The command was given nothing to act on; exit code 3.
  INPUT_EMPTY:
    severity: error
    meaning: Content expected on stdin or in a file was empty; exit code 3.
  INTERNAL_ERROR:
    severity: error
    meaning: The tool failed unexpectedly; exit code 5. Report it with the message.
  FILE_NOT_FOUND:
    severity: error
    meaning: A file or directory named on the command line does not exist; exit code 4.
  FILE_UNREADABLE:
    severity: error
    meaning: A file named on the command line cannot be read; exit code 4.
  SCHEMA_DIR_NOT_FOUND:
    severity: error
    meaning: No SCS JSON Schema directory was found (--schema-dir, SCS_SCHEMA_DIR, discovery, or the packaged copy); exit code 4.
  FILE_EXISTS:
    severity: error
    meaning: The file the command would write already exists; pass --force to overwrite it.
  OUTPUT_OUTSIDE_REPO:
    severity: error
    meaning: An output path is outside the repository root; SCS commands write only inside it.
  WORKSPACE_REQUIRED:
    severity: error
    meaning: At the root of a Domain repository a workspace-scoped command needs --workspace (D-42); exit code 3.
  WORKSPACE_NOT_FOUND:
    severity: error
    meaning: No workspace was found (no .scs/config above the current directory, or no workspace by the --workspace name).
  TEMPLATE_NOT_FOUND:
    severity: error
    meaning: No SCD or concept bundle template has the given name in the workspace's ontology model.
  CONCEPT_IS_A_DOMAIN:
    severity: error
    meaning: The name given to scs add bundle is a domain, which is a workspace of its own (scs new domain).
  COMPILE_ERROR:
    severity: error
    meaning: The bundle tree cannot be compiled (unresolved import or SCD, import cycle, DRAFT without --allow-draft, digest mismatch, or a non-compilable bundle type).
  COMPILE_WARNING:
    severity: warning
    meaning: The compiler compiled the bundle but noted a problem with its content.
