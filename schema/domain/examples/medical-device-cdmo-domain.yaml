domain:
  id: "domain:medical-device-cdmo"
  name: "Medical-Device CDMO"
  version: "0.1.0"
  description: "Structured context for contract development & manufacturing organizations (CDMOs) in the medical-device industry — regulated QMS work, computer-system validation, multi-client program segregation, and the governance of AI assistants operating inside that environment."
  author: "Ohana Consulting"
  license: "open"
  homepage: "https://structuredcontext.dev/domains/medical-device-cdmo"

  # The Domain Ontology (RFC-0001): 12 concepts, derived by adapting the
  # software-development reference set to a regulated medical-device CDMO -
  # concepts kept where they fit, renamed where the meaning shifts (e.g.
  # architecture -> system-architecture, testing-validation ->
  # verification-validation), and added where the domain has needs the
  # software set has no home for (qms-records, supplier-qualification,
  # training-competency). Inclusion rule: a concept belongs here only where
  # AI agents actually operate.
  #
  # This is the reference example for depth: relationships trace how the
  # concepts actually connect in CDMO work (e.g. verification-validation
  # depends on both risk-management and system-architecture; cutover can't
  # happen until validation and training are done), and satisfies maps each
  # concept to the regulatory clause it exists to address, in a market where
  # that mapping is the whole point. business-context and compliance-
  # governance have no outgoing edges - they're the foundation other
  # concepts point to, not concepts that depend on something else.
  ontology:
    concepts:
      - id: concept:business-context
        name: Business Context
        description: >
          Objectives and business case, scope boundaries, measurable success
          criteria, and client/program context for a CDMO engagement.
        bundle: bundle:business-context:0.1.0

      - id: concept:compliance-governance
        name: Compliance & Governance
        description: >
          Which regulations bind the work, AI deployment-tier and autonomy
          rules, and the overall QMS governance framework.
        satisfies:
          - scd:standards:iso-13485
          - scd:standards:cfr-820-qmsr
        bundle: bundle:compliance-governance:0.1.0

      - id: concept:risk-management
        name: Risk Management
        description: >
          The risk register, risk-to-requirement-to-controlling-deliverable
          traceability, data-integrity risk controls, and risk-acceptability
          criteria per ISO 14971.
        relationships:
          - type: relates-to
            target: concept:compliance-governance
        satisfies:
          - scd:standards:iso-14971
        bundle: bundle:risk-management:0.1.0

      - id: concept:system-architecture
        name: System Architecture
        description: >
          Target system design and configuration, integration topology, and
          target data/system boundaries for a CDMO program.
        relationships:
          - type: relates-to
            target: concept:business-context
        bundle: bundle:system-architecture:0.1.0

      - id: concept:security
        name: Security
        description: >
          Access-control model and the boundaries an assistant may touch in
          validated/QMS systems.
        relationships:
          - type: relates-to
            target: concept:system-architecture
        bundle: bundle:security:0.1.0

      - id: concept:verification-validation
        name: Verification & Validation
        description: >
          Computer-system validation: the validation approach (GAMP
          category; IQ/OQ/PQ) and requirements (URS) for a CDMO program.
        relationships:
          - type: depends-on
            target: concept:risk-management
          - type: depends-on
            target: concept:system-architecture
        satisfies:
          - scd:standards:iec-62304
          - scd:standards:cfr-part-11
        bundle: bundle:verification-validation:0.1.0

      - id: concept:qms-records
        name: QMS Records
        description: >
          Document hierarchy and control rules, record-retention rules, and
          CAPA triggers.
        relationships:
          - type: relates-to
            target: concept:compliance-governance
        satisfies:
          - scd:standards:iso-13485-clause-4.2
        bundle: bundle:qms-records:0.1.0

      - id: concept:supplier-qualification
        name: Supplier Qualification
        description: >
          GAMP supplier assessment for platform vendors and per-tier vendor
          approval.
        relationships:
          - type: relates-to
            target: concept:compliance-governance
          - type: relates-to
            target: concept:verification-validation
        satisfies:
          - scd:standards:iso-13485-clause-7.4
        bundle: bundle:supplier-qualification:0.1.0

      - id: concept:training-competency
        name: Training & Competency
        description: >
          Role-to-required-competency matrix and the definition of a
          qualified operator for a CDMO program.
        relationships:
          - type: relates-to
            target: concept:qms-records
        satisfies:
          - scd:standards:iso-13485-clause-6.2
        bundle: bundle:training-competency:0.1.0

      - id: concept:data-provenance
        name: Data & Provenance
        description: >
          Classification scheme, source-to-target lineage, ALCOA+ integrity,
          and RAG source-precedence rules.
        relationships:
          - type: relates-to
            target: concept:risk-management
          - type: relates-to
            target: concept:qms-records
        satisfies:
          - scd:standards:cfr-part-11
        bundle: bundle:data-provenance:0.1.0

      - id: concept:ai-accountability
        name: AI Accountability
        description: >
          Human decision authority and sign-off gates, and the
          non-decision principle for automated controls.
        relationships:
          - type: depends-on
            target: concept:compliance-governance
          - type: relates-to
            target: concept:risk-management
        bundle: bundle:ai-accountability:0.1.0

      - id: concept:implementation-cutover
        name: Implementation & Cutover
        description: >
          The cutover plan and sequence, and multi-site rollout including
          role/licensing readiness.
        relationships:
          - type: depends-on
            target: concept:verification-validation
          - type: depends-on
            target: concept:training-competency
        bundle: bundle:implementation-cutover:0.1.0

  # Shared base SCD schemas (inherited from the core spec, as in the sibling domains).
  schemas:
    meta:
      content_schema: "../../scd/meta-scd-content-schema.json"
      template: "../../scd/meta-scd-template.json"

    standards:
      content_schema: "../../scd/standards-scd-content-schema.json"
      template: "../../scd/standards-scd-template.json"

    project:
      content_schema: "../../scd/project-scd-content-schema.json"
      template: "../../scd/project-scd-template.json"

  examples:
    - "../../../examples/medical-device-cdmo/README.md"

  metadata:
    tags:
      - "medical-device"
      - "cdmo"
      - "qms"
      - "computer-system-validation"
      - "iso-13485"
      - "21-cfr-part-11"
      - "ai-governance"

    industry:
      - "Medical Devices"
      - "Life Sciences"
      - "Contract Manufacturing"

    use_cases:
      - "QMS / PLM system implementation and migration"
      - "Regulated document authoring (DHF, SOPs, validation protocols)"
      - "Computer-system validation (IQ/OQ/PQ)"
      - "Multi-client program governance and segregation"
      - "Governance of AI assistants in design, quality, and regulatory workflows"

# Domain-specific content structure preview:
#
# Meta-tier content (roles, concepts, capabilities):
#   - cdmo_roles: [quality_engineer, regulatory_lead, validation_engineer, ...]
#   - data_classifications: [public, internal, client_confidential, trade_secret, regulated]
#   - agent_autonomy_levels: [L1_human_in_loop, L2_human_on_loop, L3_autonomous]
#   - deployment_tiers: [tier_1_public, tier_2_confidential, tier_3_regulated]
#
# Standards-tier content (regulations the domain implements):
#   - quality_system: [ISO 13485, 21 CFR 820 / QMSR]
#   - software_lifecycle: [IEC 62304, 21 CFR Part 11, GAMP 5]
#   - risk: [ISO 14971, ISO/IEC 23894]
#   - ai_governance: [EU AI Act, ISO/IEC 42001, NIST AI RMF, FDA AI guidances]
#
# Project-tier content (per-program implementation):
#   - the SCDs declared by each concept bundle in examples/medical-device-cdmo/concepts/
