# SCS 0.7 glossary: short definitions. The normative ones are in spec/0.7/terminology.md.
version: 0.7.0
terms:
  context:
    label: Context
    short: >-
      The information an AI assistant uses to understand its task and the environment
      it works in.
    medium: >-
      For a language model, context exists only in the text it is given. When the rules,
      boundaries, and facts that matter are missing, it fills the gap with plausible guesses.
  structured_context:
    label: Structured Context
    short: >-
      Context an organization or person stands behind, authored deliberately and changed
      only by a new version.
    medium: >-
      Rules, boundaries, and facts, reviewed by the people accountable for them and
      versioned. Distinct from retrieved context, which changes with every query.
  scd:
    label: SCD (Structured Context Document)
    short: >-
      One YAML file about one topic, holding prohibitions, directives, and facts.
    medium: >-
      Only those three lists are compiled; the rest of the SCD (summary, provenance,
      derived_from) is for reviewers. Ids are scd:<tier>:<name>.
  prohibition:
    label: Prohibition
    short: >-
      Something the assistant must never do, use, or recommend, with no conditions.
    medium: >-
      A noun-phrase subject, compiled as "Prohibited: <subject>." with an optional approved
      alternative. Compiled first. A Project cannot lift a Domain prohibition.
  directive:
    label: Directive
    short: >-
      One instruction the assistant follows when it meets a case.
  fact:
    label: Fact
    short: >-
      One short, checkable statement the assistant needs to answer or act correctly.
  citation:
    label: Standard Citation
    short: >-
      A reference to a standard or regulation, std:<standard>[:<edition>][#<clause>].
    medium: >-
      Citations carry no text from the standard and are never resolved against a
      document. Laws and regulations use std: too (std:21-cfr-820).
  bundle:
    label: Bundle
    short: >-
      A manifest that groups SCDs, or imports other bundles.
    medium: >-
      Four types, Domain, Project, Concept, and Meta. Standards bundles are deprecated
      (0.6.0); standards are cited instead.
  domain:
    label: Domain
    short: >-
      The owner of a body of work, an organization or one person, and the governance that
      applies across all of it.
    medium: >-
      Often called Global. Carried in a Domain bundle, which imports the meta bundle and
      its concept bundles and contains no SCDs directly.
  project_bundle:
    label: Project Bundle
    short: >-
      One project's own rules.
    medium: >-
      Lists SCDs directly or imports concept bundles. It never imports the Domain; the two
      are versioned and compiled separately, and at runtime both apply, Domain first.
  concept:
    label: Concept
    short: >-
      A named category of domain knowledge, such as security or risk management.
    medium: >-
      Each concept is realized as a concept bundle with an owner role. Concepts belong to
      one Domain Ontology and are not shared across domains. Replaces "concern" (0.3 and
      earlier).
  domain_ontology:
    label: Domain Ontology
    short: >-
      A domain's concepts, with an optional taxonomy and relationships, in its domain
      manifest.
  ontology_model:
    label: Ontology Model
    short: >-
      The starting concepts and template SCDs for a type of business.
    medium: >-
      sdlc (software development, the default), cdmo (medical-device CDMO), mca (merchant
      cash advance), and personal.
  meta_bundle:
    label: Meta Bundle
    short: >-
      Universal SCS vocabulary, published with the spec and pinned by Domain bundles.
    medium: >-
      Its rules tell the assistant how Domain and Project rules combine and how to treat
      citations.
  domain_repository:
    label: Domain Repository
    short: >-
      The git repository holding one Domain workspace (domain/) and its Project workspaces
      (projects/<name>/).
  workspace:
    label: Workspace
    short: >-
      A directory with a .scs/config file; domain or a Project's directory.
  intake_record:
    label: Intake Record
    short: >-
      A workspace's intake.yaml, holding the answers, owners, approvers, source documents,
      and review findings its context was drafted from. Never compiled.
  section_owner:
    label: Section Owner
    short: >-
      The role accountable for a section (a concept bundle), who reviews and approves it.
    medium: >-
      The bundle names the role (owner, quality); the intake record names the person who
      holds it. A section cannot be versioned until its role is held.
  review_package:
    label: Review Package
    short: >-
      An HTML page of every prohibition, rule, and fact by section, with owners and sources,
      written by scs view for reviewers.
  draft:
    label: DRAFT
    short: >-
      The working state of a bundle, before review and release. Mutable; not approved.
  version:
    label: Version
    short: >-
      A released, immutable state of a bundle, recorded as a git tag with an approver and a
      content digest.
    medium: >-
      The tag is <workspace>/<bundle-name>-v<version>. A version is never overwritten; a
      change means a new version.
  content_digest:
    label: Content Digest
    short: >-
      A SHA-256 over a version's content tree, recorded in its manifest.
    medium: >-
      The compiled artifact carries it as source_digest, so an artifact can be matched to
      the approved version it came from.
  runtime_artifact:
    label: Runtime Artifact
    short: >-
      The compiled form of a version, a short YAML file of rules and facts that an AI
      service can be given.
    medium: >-
      Produced by scs compile. The same source always produces the same bytes.
  placement:
    label: Placement
    short: >-
      Putting a compiled artifact where an AI service reads it.
    medium: >-
      The owner's decision, outside SCS. docs/placement/ describes common services.
  agent_skills:
    label: Agent Skills
    short: >-
      scs-domain, scs-project, scs-validate, and scs-explain, which let an AI assistant
      operate SCS for a user through the engine.
  engine:
    label: Engine
    short: >-
      The SCS tools, scs (scs-tools) and scs-validate (scs-validator).
