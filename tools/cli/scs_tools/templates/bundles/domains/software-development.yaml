id: bundle:software-development
type: domain
version: "DRAFT"
title: "Software Development Domain"
description: "Software Development domain for {{ project_name }}, importing all software engineering concept bundles"

# Domain bundles import concept bundles (unversioned - these are DRAFT too,
# pin a real version once you've run `scs bundle version` on each)
imports:
  - bundle:architecture
  - bundle:security
  - bundle:performance-reliability
  - bundle:usability-accessibility
  - bundle:compliance-governance
  - bundle:data-provenance
  - bundle:testing-validation
  - bundle:deployment-operations
  - bundle:safety-risk
  - bundle:ethics-ai-accountability
  - bundle:business-context

# Domain bundles don't contain SCDs directly - they import concepts
scds: []

provenance:
  created_by: "{{ email }}"
  created_at: "{{ created_at }}"
  rationale: "Software Development domain bundle for {{ project_name }}"
