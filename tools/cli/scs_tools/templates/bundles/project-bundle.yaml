id: bundle:{{ project_name }}
type: project
version: "DRAFT"
title: "{{ project_name }} Governance"
description: "Governance for the {{ project_name }} project"

# A Project bundle imports its concept bundles directly. It does not import the organization's
# Domain bundle or the meta bundle; a runtime applies the Domain and Project bundles side by
# side. Concept bundles are unversioned while DRAFT; pin a version once you've run
# `scs bundle version` on each.
imports:
{% for concept in concepts %}  - bundle:{{ concept }}
{% endfor %}
scds: []

provenance:
  created_by: "{{ email }}"
  created_at: "{{ created_at }}"
  rationale: "Initial Project bundle for {{ project_name }}"
