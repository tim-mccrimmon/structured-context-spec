# Domain Ontology manifest for {{ project_name }} (SCS 0.6.0, RFC-0001).
#
# The ontology is the industry baseline: the concepts (categories) your guardrails are organized
# around. This project starts with the {{ domain_name }} reference ontology, one concept per
# concept bundle in bundles/concepts/. Add depth as you need it beyond what's here:
#   parent: concept:<id>                        a taxonomy (a concept under another concept)
#   relationships: [{type: depends-on, target: concept:<id>}]      (also: relates-to)
#   satisfies: [std:<standard>[:<edition>][#<clause>]]   standards a concept addresses (citations)
# Once a concept bundle has a released version, add `bundle: bundle:<name>:<version>` to its entry.
#
# Check it with:  scs validate --domain domain/domain-manifest.yaml

domain:
  id: "domain:{{ domain_id }}"
  name: "{{ domain_name }}"
  version: "0.1.0"
  description: "Domain Ontology for {{ project_name }}: the {{ domain_name|lower }} concepts its structured context is organized around"
  author: "{{ author }}"

  ontology:
    concepts:
{% for concept in concept_info %}      - id: concept:{{ concept.id }}
        name: {{ concept.name | yaml_dq }}
        description: {{ concept.description | yaml_dq }}
{% if concept.relationships %}        relationships:
{% for rel in concept.relationships %}          - type: {{ rel.type }}
            target: {{ rel.target }}
{% endfor %}{% endif %}{% if concept.satisfies %}        satisfies:
{% for citation in concept.satisfies %}          - {{ citation }}
{% endfor %}{% endif %}
{% endfor %}
  # Shared base SCD schemas from the core spec, as in the reference domains.
  schemas:
    meta:
      content_schema: "../../scd/meta-scd-content-schema.json"
    project:
      content_schema: "../../scd/project-scd-content-schema.json"
