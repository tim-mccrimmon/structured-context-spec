# Validates every workspace of this Domain repository on each push and pull request.
# Generated by `scs new domain` (scs-tools {{ tools_version }}).
name: SCS validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Version checks read git tags, so fetch full history and all tags (a shallow clone fails
      # with GIT_HISTORY_INCOMPLETE).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "{{ validator_requirement }}"
      - run: scs-validate --strict
