id: scd:project:software-safety-class
type: project
title: Software Safety Class
version: "1.0.0"
description: Safety classification of the pump firmware and what follows from it.
concept: concept:risk-management
content:
  summary: The firmware is IEC 62304 class C.
  directives:
    - id: SSC-001
      directive: >-
        The pump firmware is IEC 62304 software safety class C. Treat every firmware change as safety-relevant.
      cites:
        - std:iec-62304:2006-a1#4.3
    - id: SSC-002
      directive: >-
        Do not propose removing or weakening an alarm, interlock, or dose limit check. Refer such requests to the risk management lead.
      cites:
        - std:iso-14971:2019
provenance:
  created_by: "fw-lead@medtech-cdmo.example"
  created_at: "2026-10-01T09:00:00Z"
  rationale: Initial approved version
