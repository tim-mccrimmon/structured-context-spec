[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "scs-tools"
version = "0.6.0"
description = "CLI tools for Structured Context Specification (SCS) project scaffolding"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "SCS Contributors"}
]
keywords = ["scs", "structured-context", "project-scaffolding", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "jinja2>=3.0.0",
    # Validation, versioning, and compiling call the validator in-process (D-37)
    "scs-validator>=0.6.0",
]

[project.optional-dependencies]
# Kept so `pip install 'scs-tools[validator]'` still works; the validator is now a dependency
validator = ["scs-validator>=0.6.0"]

[project.urls]
Homepage = "https://github.com/tim-mccrimmon/structured-context-spec"
Repository = "https://github.com/tim-mccrimmon/structured-context-spec"
Issues = "https://github.com/tim-mccrimmon/structured-context-spec/issues"

[project.scripts]
scs = "scs_tools.cli:cli"

[tool.setuptools]
packages = ["scs_tools", "scs_tools.commands", "scs_tools.templates", "scs_tools.utils"]

[tool.setuptools.package-data]
scs_tools = ["templates/**/*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Explicit rule set so results do not change when ruff changes its defaults (ISS-036)
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
