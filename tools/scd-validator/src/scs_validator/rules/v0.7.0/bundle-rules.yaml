# Bundle Validation Rules v0.7.0
#
# Defines bundle organization and type-specific validation rules
# Based on SCS 0.6.0: Domain and Project are independent governance bundles; the Domain
# bundle pins meta; standards bundles are deprecated (citations replace them)

version: "0.7.0"
description: "Bundle organization validation rules for SCS v0.6.0 - independent Domain and Project bundles"

# Core Architectural Rule: XOR Constraint
xor_constraint:
  enabled: true
  description: "Bundles MUST contain imports OR scds, but NOT both"
  rule: "(imports AND NOT scds) OR (scds AND NOT imports)"
  severity: "error"
  rationale: "Clear separation between aggregators (imports) and containers (scds)"

  validation:
    - check: "has_imports_and_scds"
      condition: "len(imports) > 0 AND len(scds) > 0"
      message: "Bundle cannot have both imports and scds (XOR constraint)"
    - check: "has_neither"
      condition: "len(imports) == 0 AND len(scds) == 0"
      message: "Bundle must have either imports or scds (cannot be empty)"

# Bundle ID Pattern Rules
id_pattern:
  pattern: "^bundle:[a-zA-Z0-9._-]+$"
  description: "Bundle IDs must follow pattern bundle:<name>"
  severity: "error"
  examples:
    valid:
      - "bundle:medication-adherence"
      - "bundle:architecture"
      - "bundle:software-development"
      - "bundle:standards:hipaa"
    invalid:
      - "project-bundle"  # Missing bundle: prefix
      - "bundle:my bundle"  # Spaces not allowed

# Bundle Version Pattern
version_pattern:
  pattern: "^(\\d+\\.\\d+\\.\\d+|DRAFT)$"
  description: "Version must be DRAFT or semantic version X.Y.Z"
  severity: "error"

# Import Pattern Rules
import_pattern:
  pattern: "^bundle:[a-zA-Z0-9._-]+(:\\d+\\.\\d+\\.\\d+)?$"
  description: "Import references must be bundle:<name> or bundle:<name>:<version>"
  severity: "error"
  examples:
    valid:
      - "bundle:meta:0.3.0"
      - "bundle:architecture:1.0.0"
      - "bundle:software-development:1.0.0"
      - "bundle:standards"  # Without version (will check if required)
    invalid:
      - "meta:0.3.0"  # Missing bundle: prefix
      - "bundle:meta:v0.3.0"  # No 'v' prefix in version
      - "bundle:meta:0.x"  # No version ranges

# SCD Reference Pattern
scd_reference_pattern:
  pattern: "^scd:(meta|standards|project):[a-zA-Z0-9._-]+$"
  description: "SCD references in bundle must match SCD ID pattern"
  severity: "error"

# Bundle Type-Specific Rules (SCS 0.6.0 - four bundle types, standards deprecated)
#
# allowed_import_types / forbidden_import_types are checked against the resolved type of
# each imported bundle. max_imports_of_type limits how many imports of one type are allowed;
# expected_import_types produces a warning when a type is missing.
bundle_types:
  project:
    description: "Project bundle - one project's governance, independent of the Domain bundle"
    type_name: "project"

    imports:
      min: 0
      max: null
      required: false

    scds:
      min: 0
      max: null
      required: false
      tier_constraint: "project"

    allowed_import_types: ["concept"]
    forbidden_import_types: ["meta", "domain", "project", "standards"]

    role: "flexible"  # project-tier SCDs directly, or concept bundles
    xor_expectation: "either"

    rationale: "Project bundles carry only project-specific governance. They do not import or repeat the Domain bundle (SCS 0.6.0)."

  meta:
    description: "Meta-tier vocabulary bundle - container only"
    type_name: "meta"

    imports:
      min: 0
      max: 0  # Must be empty
      required: false
      message: "Meta bundles MUST NOT import other bundles"

    scds:
      min: 1
      max: null
      required: true
      message: "Meta bundles MUST contain at least one meta-tier SCD"
      tier_constraint: "meta"  # All SCDs must be meta-tier

    role: "leaf"  # Container
    xor_expectation: "scds_only"

    rationale: "Meta bundles provide universal vocabulary and are the foundation (no imports)"

  standards:
    description: "Standards bundle - deprecated in SCS 0.6.0 (use citation references)"
    type_name: "standards"
    deprecated: true

    imports:
      min: 0
      max: null
      required: false

    scds:
      min: 0
      max: null
      required: false
      tier_constraint: "standards"

    allowed_import_types: ["standards"]

    role: "flexible"
    xor_expectation: "either"

    rationale: "Kept so 0.5 content still validates. Standards are now cited (std:<standard>[:<edition>][#<clause>]) rather than bundled."

  concept:
    description: "Concept bundle - a Domain Ontology concept within a domain (RFC-0001)"
    type_name: "concept"

    imports:
      min: 0
      max: 0  # MUST be empty
      required: false
      message: "Concept bundles MUST NOT import other bundles (imports array must be empty)"

    scds:
      min: 1
      max: null
      required: true
      message: "Concept bundles MUST contain at least one project-tier SCD"
      tier_constraint: "project"  # All SCDs must be project-tier

    role: "leaf"  # Container
    xor_expectation: "scds_only"

    rationale: "Concept bundles organize a domain's concepts (Architecture, Security, Risk Management, etc.), scoped to their domain (RFC-0001 parked cross-domain import indefinitely - see Ontology Models for reuse across domains of the same business type). They contain SCDs directly and do not import other bundles."

  domain:
    description: "Domain bundle - an organization's governance (often called Global)"
    type_name: "domain"

    imports:
      min: 1  # MUST import at least one concept bundle
      max: null
      required: true
      message: "Domain bundles MUST import at least one concept bundle"

    scds:
      min: 0
      max: 0  # MUST be empty
      required: false
      message: "Domain bundles MUST have empty scds array (the organization's rules live in concept bundles)"

    allowed_import_types: ["meta", "concept", "standards"]
    forbidden_import_types: ["domain", "project"]
    max_imports_of_type:
      meta: 1
    expected_import_types: ["meta", "concept"]

    role: "branch"  # Aggregator
    xor_expectation: "imports_only"

    rationale: "A Domain bundle is self-contained organization governance: it pins the meta bundle and imports the concept bundles holding the organization's rules. An industry Ontology Model is its template; the organization's filled-in, approved version is the governance (SCS 0.6.0)."

# Bundle Required Fields
required_fields:
  all_bundles:
    - id
    - type
    - version
    - title
    - description
    - imports
    - scds
    - provenance

  provenance:
    required:
      - created_by
      - created_at
      - version_approved_by  # NEW in 0.5.0 (RFC-0001, Provenance and approval)
      - version_approved_at  # NEW in 0.5.0
    optional:
      - updated_by
      - updated_at
      - rationale

# SCD Uniqueness Rules
scd_uniqueness:
  scope: "global"  # Across entire loaded bundle set
  description: "SCD IDs must be unique across all loaded bundles"
  severity: "error"
  check_within: "root_bundle_and_all_imports"

# Cross-Bundle Relationship Rules
cross_bundle_relationships:
  allowed: true
  description: "SCDs in concept bundles can reference SCDs in other bundles"

  validation_context:
    standalone_bundle:
      severity: "warning"
      message: "Relationship target not found in this bundle (may be in another bundle)"

    complete_project:
      severity: "error"
      message: "Relationship target not found in any loaded bundle"

# Meta Bundle Special Rules
meta_bundle_requirements:
  version_alignment:
    enabled: true
    description: "Meta bundle version should align with SCS spec version"
    pattern: "^\\d+\\.\\d+\\.\\d+$"  # No DRAFT for meta bundle
    severity: "warning"

  version_pinning:
    enabled: true
    description: "Domain bundles must pin a specific meta bundle version"
    require_version_in_import: true
    pattern: "^bundle:meta:\\d+\\.\\d+\\.\\d+$"
    severity: "error"
    message: "Meta bundle import must include specific version (e.g., bundle:meta:0.6.0)"

# Validation Level 5: Bundle Completeness
bundle_validation:
  type_specific_constraints:
    enabled: true
    description: "Enforce type-specific constraints from bundle_types"

  xor_constraint:
    enabled: true
    reference: "xor_constraint"

  import_resolution:
    enabled: true
    description: "All imported bundles must be resolvable"
    severity: "error"

  scd_resolution:
    enabled: true
    description: "All referenced SCDs must exist in loaded bundles"
    severity: "error"

  scd_tier_matching:
    enabled: true
    description: "SCDs in bundle must match tier constraints"
    severity: "error"

# Error Messages
error_messages:
  xor_violation_both:
    "Bundle '{}' violates XOR constraint: has both imports ({}) and scds ({}). Bundles must contain imports OR scds, not both."

  xor_violation_neither:
    "Bundle '{}' violates XOR constraint: has neither imports nor scds. Bundles must contain either imports or scds."

  concept_bundle_has_imports:
    "Concept bundle '{}' must have empty imports array. Found {} imports. Concept bundles are containers (scds only) and cannot import other bundles."

  domain_bundle_has_scds:
    "Domain bundle '{}' must have empty scds array. Found {} SCDs. Domain bundles import concept bundles and do not contain SCDs directly."

  domain_bundle_missing_imports:
    "Domain bundle '{}' must import at least one concept bundle. Found {} imports. Domain bundles aggregate concepts."

  legacy_concern_type:
    "Bundle '{bundle_id}' has type 'concern', which was retired in SCS 0.5.0 (RFC-0001). Rename to type: concept. See docs/MIGRATION-0.5.0.md."

  meta_bundle_missing_version:
    "Meta bundle import '{}' must specify explicit version (e.g., bundle:meta:0.3.0). Version pinning required for meta bundles."

  scd_tier_mismatch:
    "SCD '{}' in {} bundle has tier '{}' but bundle requires tier '{}'."

  insufficient_scds:
    "{} bundle '{}' must contain at least {} SCD(s). Found {}."

  xor_violation:
    "Bundle '{bundle_id}' (type: {bundle_type}) violates XOR constraint: has {imports_count} imports and {scds_count} SCDs. Bundles must contain imports OR scds, not both."

  insufficient_items:
    "Bundle (type: {bundle_type}) field '{field}' has {actual} items but requires at least {required}."

  excessive_items:
    "Bundle (type: {bundle_type}) field '{field}' has {actual} items but allows maximum {allowed}."

  required_field_empty:
    "Bundle (type: {bundle_type}) required field '{field}' is empty."

  deprecated_standards_bundle:
    "Bundle '{bundle_id}' has type 'standards', which is deprecated in SCS 0.6.0. Reference standards with citations (std:<standard>[:<edition>][#<clause>]) instead. See spec/0.7/citations.md."

  deprecated_standards_scd:
    "'{ref}' is a standards-tier SCD reference, which is deprecated in SCS 0.6.0. Use a citation (std:<standard>[:<edition>][#<clause>]) instead. See spec/0.7/citations.md."

  forbidden_import_type:
    "{bundle_type} bundle '{bundle_id}' must not import a {import_type} bundle ('{ref}')."

  import_type_not_allowed:
    "{bundle_type} bundle '{bundle_id}' imports '{ref}' of type '{import_type}'; allowed import types are: {allowed}."

  too_many_imports_of_type:
    "{bundle_type} bundle '{bundle_id}' imports {count} {import_type} bundles; at most {max} allowed."

  missing_expected_import_type:
    "{bundle_type} bundle '{bundle_id}' does not import a {import_type} bundle."

  unresolved_import:
    "Import '{ref}' in bundle '{bundle_id}' could not be resolved to a bundle file."

  import_version_mismatch:
    "Import '{ref}' in bundle '{bundle_id}' resolved to a bundle with version '{version}'."

  unresolved_scd:
    "SCD '{ref}' listed in bundle '{bundle_id}' could not be resolved to an SCD file."

  content_digest_mismatch:
    "Bundle '{bundle_id}' version {version} has changed since it was versioned: its content no longer matches the content_digest in {manifest}. Changed: {changes}. A changed bundle needs a new version."

  content_digest_unrecorded:
    "Bundle '{bundle_id}' version {version} cannot be verified: its version manifest {manifest} has no content_digest (written before SCS 0.7). Version it again at a new version to make it verifiable."

  import_cycle:
    "Circular bundle imports: {cycle}."

  meta_import_unpinned:
    "Meta bundle import '{ref}' in bundle '{bundle_id}' should pin a version (e.g. bundle:meta:0.6.0)."

  invalid_meta_version:
    "Meta bundle version '{version}' does not match required pattern '{pattern}'. Meta bundles should align with SCS spec version."
