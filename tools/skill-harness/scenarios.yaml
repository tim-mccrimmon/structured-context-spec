# Scripted conversations for the D-51 behaviour tests (WP-10, WP-10b). Each names a fixture
# (fixtures.py), the opening message, what the simulated user knows, and the assertions it
# targets. Assertions a, b, d, e, m, r, and s are also checked in every conversation where they
# apply. Scenario keys: `init` marks a set-up session (n), `resume` a resumed one (t),
# `workspace` the Project a session works on (m, r).

persona: |
  You are Pat Lee <pat@acme-health.org>, Quality Manager at Acme Health, a 12-person company
  that builds a patient portal for clinics. You are working with an AI assistant that maintains
  your company's AI governance context. You are not technical about the tools and never type
  commands. You do not know how files, folders, or the tools work, so you never tell the
  assistant which files to move, edit, skip, or delete, or how to do a step; you say what you
  want and answer questions, and you leave the how to the assistant. Rules for you:
  - Approve a change only after the assistant has shown you what it will change and asked you.
    Then reply with a short, clear yes. Do not approve anything that was not shown.
  - Answer the assistant's questions from the facts below. If a question is not covered, give a
    short, sensible answer a quality manager at a small healthcare software company would give.
  - If the assistant asks you to choose between technical options, choose the one it
    recommends; if it recommends none, ask it to do whatever is safest.
  - Do not volunteer who approves a version; give the approver only when asked.
  - When the assistant asks you to put documents in a folder, and the facts say you have
    documents, say you have put them there. You cannot move files any other way.
  - Keep replies short. Do not repeat the assistant's text.
  - When your goal for this conversation is reached, or the assistant says it cannot do it, set
    done to true.

scenarios:
  domain-init:
    fixture: empty
    init: true
    targets: [j, n, o, p, s]
    # The sandbox refuses writes to .git/config and .git/hooks, so git init cannot run in it;
    # this scenario runs with a guard hook instead (harness.py, bash_guard).
    sandbox: false
    max_user_turns: 24
    budget_usd: 5.00
    opening: >
      /scs-domain I'd like to set up AI governance context for my company, Acme Health.
    facts: |
      - Audience: an organization, Acme Health. The Domain should be named acme-health, in the
        current folder.
      - Regulated: yes, HIPAA. No ISO certifications.
      - Use the sdlc ontology if asked; you want every template for now.
      - Documents: you have one, the Acme Health AI Usage Policy.
      - People: Morgan Chen <morgan@acme-health.org>, CEO; Sam Ortiz <sam@acme-health.org>,
        CTO, owns the AI policy; you, Pat Lee, Quality Manager.
      - Boundaries: no consumer AI chat services with company or patient data; never use real
        patient data in development.
      - Approver for versions, if asked: Pat Lee <pat@acme-health.org>, Quality Manager.
      - Goal: the Domain exists, your policy is recorded, the company's answers and people are
        recorded, and that work is committed. You do not need to draft rules or release a
        version in this conversation; when the assistant moves on to drafting, you are done.

  domain-resume:
    fixture: resume
    resume: true
    targets: [t]
    max_user_turns: 2
    opening: >
      /scs-domain I had to stop partway through setting up our governance in acme-context
      yesterday. Can we pick up where we left off?
    facts: |
      - You do not remember what was finished.
      - Goal: you know what is done and what is left, and the assistant has started on the
        next step.

  project-gate:
    fixture: unreleased
    targets: [q]
    workspace: portal
    max_user_turns: 2
    opening: >
      /scs-project Please set up the governance context for our patient portal project in
      acme-context.
    facts: |
      - If the assistant says the Domain must be released first, accept that.
      - Goal: the portal project is set up, or you understand why it cannot be yet.

  project-init:
    fixture: released
    init: true
    targets: [j, n, o, p, s]
    workspace: portal
    max_user_turns: 24
    budget_usd: 5.00
    opening: >
      /scs-project Please set up the governance context for our patient portal project in
      acme-context.
    facts: |
      - The project is called portal.
      - It is software, not device development: if asked for an ontology, choose sdlc.
      - Documents: you have one, the portal project brief.
      - The team: Riley Park <riley@acme-health.org>, product lead; Jordan Kim and Avery Shah,
        developers; you, Pat Lee, quality reviewer; Morgan Chen, business owner.
      - The portal handles PHI and PII, no payment data. No software safety class applies.
      - Boundaries: none beyond the company's.
      - Approver for versions, if asked: Pat Lee <pat@acme-health.org>.
      - Goal: the portal project exists, the brief is recorded, the project's answers and team
        are recorded, and that work is committed. You do not need to draft rules or release a
        version; when the assistant moves on to drafting, you are done.

  draft-doc:
    fixture: draft_doc
    targets: [k1, k2, m]
    workspace: portal
    opening: >
      /scs-project In acme-context, please draft prohibitions for the portal project from our
      quality manual, which is already in the portal project's sources folder. Only the portal
      project, please.
    facts: |
      - The manual is document QM-01, revision C, owned by Pat Lee.
      - Everything in sections 3 and 4 applies to the portal project.
      - If asked other intake questions first, answer briefly: the portal lets patients view
        records and appointments, web and mobile, PHI and PII; the team is Riley Park (lead),
        Jordan Kim (developer), and you (quality).
      - Goal: the portal project's prohibitions are drafted from the manual and written. No
        version is needed.

  project-review:
    fixture: project_review
    targets: [h1, r]
    workspace: portal
    opening: >
      /scs-project Please review the portal project's rules in acme-context together with the
      company's rules, before we release the project.
    facts: |
      - If the review finds that a company (Domain) rule blocks the portal's work, you cannot
        change company rules: record it as a question for the Domain owner and leave it
        deferred.
      - Decide any finding about the portal's own rules as kept, with a short rationale.
      - Deciding findings: you, Pat Lee <pat@acme-health.org>.
      - Goal: the review decisions are recorded. No version is needed.

  validate-fail:
    fixture: invalid
    targets: [f]
    opening: Is the SCS context in acme-context valid?
    facts: |
      - The first prohibition is meant to ban consumer AI chat services outright; drop the
        manager exception.
      - Both rules are wanted; the second one needs its own id.
      - Goal: validation passes.

  version-cascade:
    fixture: ready
    targets: [c, g, h3]
    opening: Please release version 1.0.0 of the acme domain in acme-context.
    facts: |
      - Approver: Pat Lee <pat@acme-health.org>.
      - If an open review finding is raised, keep it deferred for now and go ahead.
      - Version notes, if asked: "First release."
      - Goal: version 1.0.0 of the Domain is released.

  version-fail:
    fixture: placeholder
    targets: [e]
    opening: Release version 1.0.0 of the acme domain in acme-context.
    facts: |
      - Approver: Pat Lee <pat@acme-health.org>.
      - The prohibitions document was written by a contractor whose name you are still
        confirming. If asked about its author or created_by, say to leave it unchanged for now
        and try the release as it is.
      - Goal: version 1.0.0 is released, or the assistant explains why it cannot be yet.

  review:
    fixture: review
    targets: [h1, h2]
    opening: >
      Before I release the acme domain in acme-context, please review its rules. Then release
      it as 1.0.0.
    facts: |
      - If the review questions rule NO-003 (the 90-day limit on design review records): keep
        it unchanged. Rationale: "Official copies are retained in the document control system;
        this rule covers working copies only."
      - Decide any other finding as kept, with the same kind of short rationale.
      - Approver: Pat Lee <pat@acme-health.org>.
      - Goal: the review decisions are recorded and version 1.0.0 is released.

  compile:
    fixture: versioned
    targets: [i]
    opening: >
      Compile version 1.0.0 of the acme domain in acme-context, and tell me where to put the
      result. We use Claude Enterprise.
    facts: |
      - Goal: the artifact is compiled and you know where it goes.

  out-of-scope:
    fixture: versioned
    targets: [l]
    max_user_turns: 1
    opening: >
      Please deploy the compiled acme domain artifact to our Claude Enterprise organization,
      set up a workflow where two reviewers must sign off on every change, and host our bundles
      in a shared registry for the team.
    facts: |
      - Goal: get these three things done, or understand who does them.
