name: tools-ci

# CI for tools/scd-validator (scs-validator) and tools/cli (scs-tools). ISS-013.
# The regression suites also validate every shipped example, ontology manifest and scaffold, so a
# change to schema/, rules/, templates or examples that breaks 0.5.0 behaviour fails here.

on:
  push:
    branches: [main, 0.5-dev]
    paths:
      - "tools/**"
      - "schema/**"
      - "examples/**"
      - ".github/workflows/tools-ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - "schema/**"
      - "examples/**"
      - ".github/workflows/tools-ci.yml"

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install both packages (editable) and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e tools/scd-validator -e tools/cli pytest pytest-cov
      - name: scs-validator tests
        working-directory: tools/scd-validator
        run: python -m pytest tests
      - name: scs-tools tests
        working-directory: tools/cli
        run: python -m pytest tests

  lint:
    # ruff (E, F, W, I), black and mypy, configured in each package's pyproject.toml (ISS-036)
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "tools/scd-validator[dev]" -e tools/cli
      - name: ruff
        run: ruff check tools/scd-validator/src tools/scd-validator/tests tools/scd-validator/scripts tools/cli/scs_tools tools/cli/tests
      - name: black (scs-validator)
        working-directory: tools/scd-validator
        run: black --check src tests scripts
      - name: black (scs-tools)
        working-directory: tools/cli
        run: black --check scs_tools tests
      - name: mypy (scs-validator)
        working-directory: tools/scd-validator
        run: mypy src

  wheel-smoke:
    # Installs the built wheels (not editable) into a clean environment and uses them away from the
    # source tree. Guards ISS-035: rules/ and schemas/ must ship inside the scs-validator wheel.
    name: wheel install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install the wheels (non-editable)
        run: |
          pip wheel --no-deps -w dist ./tools/scd-validator ./tools/cli
          pip install dist/*.whl
      - name: Scaffold, validate and version outside the source tree
        run: |
          cd "$(mktemp -d)"
          scs new project smoke --type healthcare --author CI --email ci@example.com --no-interactive
          cd smoke
          scs bundle validate
          scs validate --domain domain/domain-manifest.yaml
          for f in context/project/*.yaml; do scs-validate "$f" > /dev/null; done
          git init -q .
          git config user.email ci@example.com
          git config user.name CI
          git add -A
          git commit -q -m init
          scs bundle version --bundle bundles/concepts/security.yaml --version 0.1.0 \
            --approved-by ci@example.com --notes "ci smoke"
          scs-validate --bundle bundles/concepts/security-v0.1.0.yaml
