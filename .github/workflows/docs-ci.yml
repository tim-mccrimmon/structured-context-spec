name: docs-ci

# Checks for spec/, docs/, rfcs/ and skills/ (WP-11rc): relative links resolve, the 0.7 migration
# guide matches its fragments, and the files copied into the skills match their sources.

on:
  push:
    branches: [main, 0.7-dev]
    paths:
      - "spec/**"
      - "docs/**"
      - "rfcs/**"
      - "skills/**"
      - "schema/diagnostics/**"
      - "scripts/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs-ci.yml"
  pull_request:
    paths:
      - "spec/**"
      - "docs/**"
      - "rfcs/**"
      - "skills/**"
      - "schema/diagnostics/**"
      - "scripts/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - ".github/workflows/docs-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relative links
        run: python scripts/check_links.py
      - name: Migration guide assembled from docs/migration.d
        run: python scripts/assemble_migration.py --check
      - name: Skill copies match their sources
        run: |
          pip install pyyaml
          python skills/sync.py --check
